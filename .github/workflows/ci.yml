name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PATH: ':memory:'
      NODE_ENV: test
      WS_LIVE_VISION: '0'
      DOTENV_CONFIG_PATH: /dev/null
      TMPDIR: ${{ github.workspace }}/../ws-test-scratch
    steps:
      - name: Create isolated test scratch
        run: node -e "require('node:fs').mkdirSync(process.env.TMPDIR, {recursive:true})"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document prerequisites (no model providers)
        run: |
          python3 -m pip install 'PyMuPDF==1.26.7'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -c "import pymupdf; assert pymupdf.VersionBind == '1.26.7'"
          pdftotext -v
      - name: Require Node 24 across runtime and build definitions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const want = fs.readFileSync('.nvmrc', 'utf8').trim();
          const engines = require('./package.json').engines.node.match(/\d+/)?.[0];
          const bases = [...fs.readFileSync('Dockerfile', 'utf8').matchAll(/FROM\s+node:(\d+)/gi)].map(m => m[1]);
          if (want !== '24' || process.versions.node.split('.')[0] !== want || engines !== want || !bases.length || bases.some(v => v !== want)) {
            throw new Error('Node version mismatch: align .nvmrc, runtime, engines and every Docker Node base');
          }
          NODE
      - name: Install backend dependencies
        run: npm ci --include=dev
      - name: Install frontend dependencies
        run: npm ci --include=dev
        working-directory: frontend
      - name: Lint backend
        run: npm run lint
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Backend tests (isolated DB; live inference disabled)
        run: npm test
      - name: Typecheck frontend project references
        run: npx tsc -b
        working-directory: frontend
      - name: Frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Isolated authenticated HTTP smoke after build
        run: node --test test/ciContract.test.js
        env:
          WS_QA_PUBLIC_DIR: ${{ github.workspace }}/public
      - name: Install Chromium for isolated build visibility checks
        run: npx playwright install chromium --with-deps
      - name: Isolated authenticated build visibility and mismatch checks
        run: node test/buildVisibility.e2e.js
        env:
          WS_QA_PUBLIC_DIR: ${{ github.workspace }}/public

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            WS_SOURCE_REVISION=${{ github.sha }}
            WS_SOURCE_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
